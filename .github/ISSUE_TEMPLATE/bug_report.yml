name: Bug Report
description: Create a report to help us improve Lumina SASS
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out a bug report for Lumina SASS!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: code-snippet
    attributes:
      label: Sass Code Snippet
      description: Provide the exact Sass/SCSS code snippet that causes the issue.
      placeholder: |
        @use 'lumina-sass/mixins' as l-mix

        .toggle
          @include l-mix.nav-hamburger()
    validations:
      required: true

  - type: textarea
    id: stack-trace
    attributes:
      label: Error Stack Trace / Build Log
      description: Paste full error log outputs (Vite, Webpack, Dart Sass compiler logs).
      placeholder: "Undefined mixin: @include l-mix.nav-hamburger()"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, Sass compiler version, build tool (Vite, Next.js, etc.)
      placeholder: "Vite 5.0, Dart Sass 1.70, Node 20"
    validations:
      required: false
