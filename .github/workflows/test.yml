name: Automated test

on:
  push:
    branches: [ master ]
    tags-ignore:
      - 'v*.*.*'

    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'

  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Vitest & Sass Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Vitest & Test Suite
        run: npm test
